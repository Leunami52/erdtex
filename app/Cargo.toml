[workspace]
members = ["crates/core", "crates/core-wasm", "crates/pdf-wasm", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

# no debug info for the dependencies in test builds: target/debug stays a fraction of its size
# (backtraces keep their line numbers in our own crates)
[profile.dev.package."*"]
debug = false

# small and fast: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
