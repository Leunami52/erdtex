[package]
name = "erdtex"
version = "3.5.0"
description = "ERDTeX"
edition.workspace = true
license.workspace = true

[lib]
# the _lib suffix keeps the library's name apart from the binary's (cargo issue 8519)
name = "erdtex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
# the desktop portal on Linux: the desktop's own file dialog (KDE's on Plasma, GNOME's on GNOME)
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
toml = "0.9"
svg2pdf = { version = "0.13.0", default-features = false }
resvg = { version = "0.45.1", default-features = false }
diagram-core = { version = "0.1.0", path = "../crates/core" }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
libc = "0.2"
